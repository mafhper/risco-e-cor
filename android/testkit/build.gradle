// Modulo JVM puro: gera os assets do POC-A e roda o portao de conteudo.
apply plugin: 'java-library'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// ./gradlew.bat :testkit:generateContent  -> cria content/*.map|.png|.json
tasks.register('generateContent', JavaExec) {
    group = 'poc'
    description = 'Gera content/page_poc e content/page_adversarial (.map, .png, .json)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.theomaria.poc.testkit.Main'
    args rootProject.file('content').absolutePath
}

dependencies {
    testImplementation "junit:junit:${rootProject.ext.junitVersion}"
}
